[package]
name = "skeleton-commit-script"
version = "0.1.0"
edition = "2021"
default-run = "prove_skeleton"
publish = false

[[bin]]
name = "prove_skeleton"
path = "src/bin/prove_skeleton.rs"

[dependencies]
sp1-sdk = { version = "6.6.0", features = ["blocking", "native-gnark"] }
hex = "0.4.3"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
clap = { version = "4.0", features = ["derive"] }
alloy-sol-types = { workspace = true }
# Native acceptance preflight + tests (same crate the guest links).
skeleton-commit-program = { path = "../program" }

[build-dependencies]
sp1-build = "6.6.0"
